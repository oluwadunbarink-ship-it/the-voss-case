<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b0b" />

  <title>The Voss Case: AI Detective Interrogation Game</title>
  <meta name="description" content="Investigate two AI-driven cold cases. Interrogate a suspect in real time or dig through the evidence of a vanished woman at the Grand Meridian Hotel." />
  <meta name="keywords" content="detective game, AI interrogation, cold case, mystery, interactive fiction, The Voss Case, Room 17" />
  <meta name="author" content="The Voss Case" />
  <link rel="canonical" href="https://thevosscase.com/" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thevosscase.com/" />
  <meta property="og:title" content="The Voss Case: AI Detective Investigation Game" />
  <meta property="og:description" content="Interrogate a suspect or reconstruct the cold case of the woman in Room 17." />
  <meta property="og:image" content="https://thevosscase.com/background.jpg" />
  <meta property="og:image:alt" content="The Voss Case detective investigation game" />
  <meta property="og:site_name" content="The Voss Case" />
  <meta property="og:locale" content="en_US" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Voss Case: AI Detective Investigation Game" />
  <meta name="twitter:description" content="Interrogate a suspect or reconstruct the cold case of the woman in Room 17." />
  <meta name="twitter:image" content="https://thevosscase.com/background.jpg" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "The Voss Case",
    "url": "https://thevosscase.com/",
    "description": "An AI-driven detective investigation game with two cases: a live interrogation and a cold-case evidence reconstruction.",
    "genre": ["Mystery", "Interactive Fiction", "Detective"],
    "applicationCategory": "Game",
    "operatingSystem": "Any",
    "gamePlatform": "Web",
    "inLanguage": "en",
    "image": "https://thevosscase.com/background.jpg",
    "author": { "@type": "Organization", "name": "The Voss Case" }
  }
  </script>
</head>
<body>
  <main class="game-shell" id="game-shell">
    <header class="topbar">
      <span class="case-file">CASE FILE</span>
      <nav class="stage3-nav" aria-label="Case sections"></nav>
      <span class="status"><i></i> LOCAL CONNECTION</span>
      <span class="case-switcher" title="Select a case">
        <span class="switch-label">CASE</span>
        <select id="case-select" aria-label="Select case"></select>
      </span>
      <button class="voice-toggle" type="button" aria-pressed="false" title="Toggle text-to-speech">VOICE ON</button>
      <button class="investigate-button" type="button">INVESTIGATE</button>
      <button id="reset" class="quiet-button">Reset case</button>
    </header>

    <section class="room" aria-label="Investigation room">
      <div class="light"></div>
      <div class="mirror"></div>
      <div class="suspect-shadow"></div>
      <div class="table">
        <div class="recorder"></div>
        <div class="evidence-photo"></div>
      </div>
      <div class="suspect">
        <p class="suspect-name"></p>
        <div class="head"></div>
        <div class="body"></div>
      </div>
      <div class="room-caption"></div>
    </section>

    <aside class="case-panel"></aside>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <form class="question-box" id="question-form">
      <label for="question">Your question</label>
      <div>
        <input id="question" autocomplete="off" placeholder="Type a question…" />
        <button id="ask" type="submit">Ask</button>
      </div>
      <p id="connection-note">Connected to localhost:20128</p>
    </form>
  </main>

  <footer class="site-footer">
    <p>The Voss Case · an AI-driven detective investigation game</p>
    <p><a href="/sitemap.xml">Sitemap</a> · <a href="/llms.txt">llms.txt</a></p>
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
