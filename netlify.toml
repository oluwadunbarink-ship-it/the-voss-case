# Netlify configuration for The Voss Case
# - Serves the static site from the repo root (no build step).
# - Runs the chat proxy as a serverless function so the LLM API key stays secret.
# - Uses the custom 404.html for unmatched routes.

[build]
  command = "echo 'Static site — no build step required.'"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Route the client's chat request (/api/chat/completions) to the serverless function.
[[redirects]]
  from = "/api/chat/completions"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Serve the custom 404 page for anything else that doesn't exist.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
